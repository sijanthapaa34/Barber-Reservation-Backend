# Test Database Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (optional, for debugging)
spring.h2.console.enabled=false

# Mail Configuration (disabled for tests)
mail.gmail.host=smtp.gmail.com
mail.gmail.port=587
mail.gmail.username=test@test.com
mail.gmail.password=testpassword

# Google OAuth (test values)
google.clientId.web=test-web-client-id
google.clientId.ios=test-ios-client-id
google.clientId.android=test-android-client-id

# Khalti (Test Mode)
khalti.secret-key=test-secret-key
khalti.base-url=https://dev.khalti.com/api/v2/epayment/
khalti.website-url=https://test.com

# eSewa (Test Mode)
esewa.merchant-id=EPAYTEST
esewa.secret-key=test-secret
esewa.base-url=https://rc.esewa.com.np/api/epay/
esewa.success-url=https://test.com/payment/success
esewa.failure-url=https://test.com/payment/failure

# JWT configuration
jwt.secret=testsecretkeytestsecretkeytestsecretkey123456
jwt.expiration=3600000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google Drive Folder IDs (test values)
google.drive.folder.profile=test-profile-folder
google.drive.folder.application-profile=test-app-profile-folder
google.drive.folder.application-doc=test-app-doc-folder
google.drive.folder.shop-images=test-shop-images-folder

# Logging
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
